[project]
name = "fork-sql"
version = "0.0.1"
description = "An ambiguity checker for text-to-SQL agents: finds where an answer depends on an unstated reading of a column or value."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Coyle" }]
dependencies = [
    "sqlglot>=27",
    "anthropic>=1.0",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "psycopg[binary]>=3.1", "mcp>=1.2", "python-dotenv>=1.0"]

[project.scripts]
fork = "fork.cli:main"
fork-mcp = "fork.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fork"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
